name: Publish site

# The marketing pages are generated locally and committed in docs/ (build.mjs needs the app
# repository for the privacy and support text). CI builds only the guide (guide/, VitePress)
# into docs/guide/ and publishes the combined docs/ folder.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - name: Build the guide into docs/guide
        working-directory: guide
        run: |
          npm ci
          npm run build
      - name: Check the combined site
        run: node tools/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
